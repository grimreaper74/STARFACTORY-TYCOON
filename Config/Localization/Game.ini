; Line Boss localisation gather target.
;
; Collects every FText/LOCTEXT in game source plus text properties in our
; own content into Content/Localization/Game, generating the manifest, the
; native archive and one archive per launch culture. Translation itself is
; deferred to near the EA build (owner decision, 2026-08-19); running this
; gather regularly keeps the string inventory honest and catches any
; hard-coded player-facing FString the moment it appears.
;
; Run with:
;   UnrealEditor-Cmd.exe <project> -run=GatherText
;       -config="Config/Localization/Game.ini" -unattended

[CommonSettings]
SourcePath=%LOCPROJECTROOT%Content/Localization/Game
DestinationPath=%LOCPROJECTROOT%Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
ResourceName=Game.locres
PortableObjectName=Game.po
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=de
CulturesToGenerate=zh-Hans

; Every LOCTEXT/NSLOCTEXT in game code.
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Source/LineBossCarFactory
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=false

; Text properties in our own assets only - the owned Fab packs localise
; nothing player-facing and would drown the report.
[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/LineBoss/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=true

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
DestinationPath=%LOCPROJECTROOT%Content/Localization/Game
bWordCountReport=true
WordCountReportName=GameWordCount.csv
